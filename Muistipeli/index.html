<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Muistipeli 10×10</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
}

.game {
    width: min(96vw, 900px);
    text-align: center;
    padding: 15px;
}

h1 {
    margin: 5px 0 10px;
    font-size: clamp(28px, 5vw, 45px);
}

.info {
    display: flex;
    justify-content: center;
    gap: 35px;
    font-size: 18px;
    margin-bottom: 12px;
}

.board {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 5px;
    width: 100%;
}

.card {
    aspect-ratio: 1;
    perspective: 700px;
    cursor: pointer;
}

.card-inner {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.35s;
}

.card.flipped .card-inner,
.card.matched .card-inner {
    transform: rotateY(180deg);
}

.front,
.back {
    position: absolute;
    inset: 0;
    border-radius: 7px;
    display: flex;
    justify-content: center;
    align-items: center;
    backface-visibility: hidden;
    box-shadow: 0 2px 5px rgba(0,0,0,0.25);
}

.back {
    background: #222;
    font-size: clamp(12px, 3vw, 25px);
}

.front {
    background: white;
    color: black;
    transform: rotateY(180deg);
    font-size: clamp(14px, 3vw, 30px);
}

.matched {
    pointer-events: none;
}

button {
    border: none;
    padding: 12px 25px;
    margin-top: 15px;
    border-radius: 10px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    transform: scale(1.05);
}

#message {
    min-height: 30px;
    margin-top: 10px;
    font-size: 20px;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="game">

    <h1>🧠 Muistipeli 10×10</h1>

    <div class="info">
        <div>⏱️ <span id="time">0</span>s</div>
        <div>🎯 Siirrot: <span id="moves">0</span></div>
        <div>✅ Parit: <span id="matches">0</span>/50</div>
    </div>

    <div id="board" class="board"></div>

    <div id="message"></div>

    <button onclick="startGame()">🔄 Uusi peli</button>

</div>

<script>

const emojis = [
    "🍎","🍌","🍕","🍔","🚗",
    "🚀","🐶","🐱","🐭","🦊",
    "🐻","🐼","🐸","🐵","🦁",
    "🐯","🐮","🐷","🐙","🦄",
    "🐝","🦋","🌸","🌻","🌈",
    "⭐","🌙","☀️","🔥","❄️",
    "⚽","🏀","🏈","⚾","🎾",
    "🎮","🎲","🎸","🎹","🎧",
    "🚲","✈️","🚁","🚢","🏠",
    "💎","🍩","🍪","🍓","🍉"
];

let firstCard = null;
let secondCard = null;
let locked = false;

let moves = 0;
let matches = 0;
let seconds = 0;
let timer = null;

function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }

    return array;
}

function startGame() {

    clearInterval(timer);

    firstCard = null;
    secondCard = null;
    locked = false;

    moves = 0;
    matches = 0;
    seconds = 0;

    document.getElementById("moves").textContent = "0";
    document.getElementById("matches").textContent = "0";
    document.getElementById("time").textContent = "0";
    document.getElementById("message").textContent = "";

    const board = document.getElementById("board");

    board.innerHTML = "";

    // Jokaisesta symbolista tehdään kaksi korttia
    let deck = [...emojis, ...emojis];

    shuffle(deck);

    deck.forEach(emoji => {

        const card = document.createElement("div");

        card.className = "card";
        card.dataset.value = emoji;

        card.innerHTML = `
            <div class="card-inner">
                <div class="back">❓</div>
                <div class="front">${emoji}</div>
            </div>
        `;

        card.addEventListener("click", flipCard);

        board.appendChild(card);
    });

    timer = setInterval(() => {

        seconds++;

        document.getElementById("time").textContent = seconds;

    }, 1000);
}

function flipCard() {

    if (locked) return;

    if (this === firstCard) return;

    if (this.classList.contains("matched")) return;

    this.classList.add("flipped");

    if (!firstCard) {

        firstCard = this;

        return;
    }

    secondCard = this;

    moves++;

    document.getElementById("moves").textContent = moves;

    checkMatch();
}

function checkMatch() {

    const isMatch =
        firstCard.dataset.value === secondCard.dataset.value;

    if (isMatch) {

        firstCard.classList.add("matched");
        secondCard.classList.add("matched");

        matches++;

        document.getElementById("matches").textContent = matches;

        resetTurn();

        if (matches === 50) {
            gameWon();
        }

    } else {

        locked = true;

        setTimeout(() => {

            firstCard.classList.remove("flipped");
            secondCard.classList.remove("flipped");

            resetTurn();

        }, 800);
    }
}

function resetTurn() {

    firstCard = null;
    secondCard = null;
    locked = false;
}

function gameWon() {

    clearInterval(timer);

    document.getElementById("message").textContent =
        `🎉 Voitit! ${seconds} sekuntia ja ${moves} siirtoa!`;
}

startGame();

</script>

</body>
</html>

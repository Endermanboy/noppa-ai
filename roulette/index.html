<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roulette</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background:
        radial-gradient(circle at center, #164b2c 0%, #082015 70%);
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
}

.game {
    text-align: center;
    width: 95%;
    max-width: 700px;
}

h1 {
    font-family: Georgia, serif;
    font-size: 48px;
    margin: 10px;
    text-shadow: 0 3px 5px black;
}

.wheel-wrap {
    position: relative;
    width: min(620px, 90vw);
    aspect-ratio: 1;
    margin: 20px auto;
}

.wheel {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: 18px solid #111;
    box-shadow:
        0 0 0 8px #c99b45,
        0 15px 40px black;
    transition: transform 6s cubic-bezier(.12,.7,.15,1);
}

.ball {
    position: absolute;
    width: 20px;
    height: 20px;
    background: white;
    border-radius: 50%;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    box-shadow: 0 2px 8px black;
    z-index: 5;
}

.pointer {
    position: absolute;
    top: -5px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 17px solid transparent;
    border-right: 17px solid transparent;
    border-top: 35px solid #d6b35a;
    z-index: 10;
    filter: drop-shadow(0 2px 3px black);
}

button {
    border: none;
    border-radius: 10px;
    padding: 15px 45px;
    font-size: 22px;
    font-weight: bold;
    background: #c99b45;
    color: #17110a;
    cursor: pointer;
    box-shadow: 0 4px 10px black;
}

button:hover {
    filter: brightness(1.15);
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

.result {
    margin-top: 18px;
    min-height: 65px;
}

.number {
    font-size: 42px;
    font-weight: bold;
}

.color {
    font-size: 18px;
}

.history {
    margin: 20px auto;
    display: flex;
    justify-content: center;
    gap: 7px;
    flex-wrap: wrap;
    max-width: 600px;
}

.history span {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-weight: bold;
    border: 2px solid white;
}

.red {
    background: #c62828;
}

.black {
    background: #111;
}

.green {
    background: #168044;
}

.info {
    color: #ccc;
    font-size: 14px;
}
</style>
</head>

<body>

<div class="game">

    <h1>🎰 ROULETTE</h1>

    <div class="wheel-wrap">
        <div class="pointer"></div>

        <canvas id="wheel" class="wheel" width="620" height="620"></canvas>

        <div class="ball"></div>
    </div>

    <button id="spin">SPIN</button>

    <div class="result">
        <div class="number" id="number">—</div>
        <div class="color" id="color">Spin the wheel</div>
    </div>

    <div class="history" id="history"></div>

    <div class="info">
        European roulette • 0–36
    </div>

</div>

<script>

const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");

const spinButton = document.getElementById("spin");
const numberText = document.getElementById("number");
const colorText = document.getElementById("color");
const history = document.getElementById("history");

const numbers = [
    0, 32, 15, 19, 4, 21, 2, 25, 17, 34,
    6, 27, 13, 36, 11, 30, 8, 23, 10, 5,
    24, 16, 33, 1, 20, 14, 31, 9, 22, 18,
    29, 7, 28, 12, 35, 3, 26
];

const redNumbers = [
    1,3,5,7,9,12,14,16,18,
    19,21,23,25,27,30,32,34,36
];

let rotation = 0;
let spinning = false;

function getColor(number) {
    if (number === 0) return "green";
    return redNumbers.includes(number) ? "red" : "black";
}

function drawWheel() {

    const cx = canvas.width / 2;
    const cy = canvas.height / 2;
    const radius = 290;
    const slice = Math.PI * 2 / numbers.length;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Outer gold ring
    ctx.beginPath();
    ctx.arc(cx, cy, radius + 15, 0, Math.PI * 2);
    ctx.fillStyle = "#c99b45";
    ctx.fill();

    for (let i = 0; i < numbers.length; i++) {

        const start = -Math.PI / 2 + i * slice;
        const end = start + slice;

        const color = getColor(numbers[i]);

        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, radius, start, end);
        ctx.closePath();

        ctx.fillStyle =
            color === "red" ? "#b51f25" :
            color === "black" ? "#101010" :
            "#08783e";

        ctx.fill();

        ctx.strokeStyle = "#d6b35a";
        ctx.lineWidth = 2;
        ctx.stroke();

        // Number
        ctx.save();

        ctx.translate(cx, cy);
        ctx.rotate(start + slice / 2);

        ctx.fillStyle = "white";
        ctx.font = "bold 23px Georgia";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        ctx.fillText(numbers[i], radius - 42, 0);

        ctx.restore();
    }

    // Center
    ctx.beginPath();
    ctx.arc(cx, cy, 55, 0, Math.PI * 2);
    ctx.fillStyle = "#111";
    ctx.fill();

    ctx.beginPath();
    ctx.arc(cx, cy, 42, 0, Math.PI * 2);
    ctx.strokeStyle = "#c99b45";
    ctx.lineWidth = 5;
    ctx.stroke();
}

function spin() {

    if (spinning) return;

    spinning = true;
    spinButton.disabled = true;

    numberText.textContent = "…";
    colorText.textContent = "Spinning...";

    const winningIndex =
        Math.floor(Math.random() * numbers.length);

    const slice = 360 / numbers.length;

    /*
        Add several full rotations and then
        stop with the selected number at the top.
    */

    const currentDegrees = rotation * 180 / Math.PI;

    const target =
        currentDegrees +
        360 * (5 + Math.floor(Math.random() * 4)) +
        (360 - winningIndex * slice);

    rotation = target * Math.PI / 180;

    canvas.style.transform =
        `rotate(${rotation}rad)`;

    setTimeout(() => {

        const number = numbers[winningIndex];
        const color = getColor(number);

        numberText.textContent = number;

        if (color === "red") {
            colorText.textContent = "RED";
            numberText.style.color = "#ff5555";
        }
        else if (color === "black") {
            colorText.textContent = "BLACK";
            numberText.style.color = "#ddd";
        }
        else {
            colorText.textContent = "GREEN";
            numberText.style.color = "#42d67a";
        }

        addHistory(number, color);

        spinButton.disabled = false;
        spinning = false;

    }, 6100);
}

function addHistory(number, color) {

    const item = document.createElement("span");

    item.textContent = number;
    item.className = color;

    history.prepend(item);

    // Keep last 15 results
    while (history.children.length > 15) {
        history.removeChild(history.lastChild);
    }
}

spinButton.addEventListener("click", spin);

drawWheel();

</script>

</body>
</html>

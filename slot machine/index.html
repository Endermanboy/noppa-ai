<script>
const symbols = ["🍒","🍋","⭐","💎","7️⃣"];

let results = ["","",""];

function fillReel(el){
  el.innerHTML="";
  for(let i=0;i<20;i++){
    const s=document.createElement("div");
    s.className="symbol";
    const sym = symbols[Math.floor(Math.random()*symbols.length)];
    s.textContent = sym;
    el.appendChild(s);
  }
}

function spin(){
  const reels=[r1,r2,r3];

  reels.forEach((reel,i)=>{
    fillReel(reel);

    const index = Math.floor(Math.random()*10)+5; // keskialue
    const offset = index * 80;

    // tallenna tulos
    results[i] = reel.children[index].textContent;

    reel.style.transition="none";
    reel.style.transform="translateY(0px)";

    setTimeout(()=>{
      reel.style.transition="transform 1s cubic-bezier(.2,.8,.3,1)";
      reel.style.transform=`translateY(-${offset}px)`;
    },50 + i*200);
  });

  setTimeout(()=>{
    const [a,b,c] = results;

    let sound = "";

    if(a===b && b===c){
      sound = "sounds/three.mp3"; // 3 samaa
    } else if(a===b || b===c || a===c){
      sound = "sounds/two.mp3"; // 2 samaa
    }

    if(sound){
      const audio = new Audio(sound);
      audio.play();
    }

  },1500);
}
</script>

<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<title>3D Slot</title>

<style>
body{
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  margin:0;
  background:#111;
  color:white;
  flex-direction:column;
  font-family:Arial;
  perspective:1000px;
}

.machine{
  display:flex;
  gap:20px;
}

.reel{
  width:80px;
  height:80px;
  overflow:hidden;
  border:2px solid white;
  border-radius:10px;
  background:#000;
}

.reel div{
  display:flex;
  flex-direction:column;
  align-items:center;
}

.symbol{
  height:80px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:40px;
}

button{
  margin-top:20px;
  padding:10px 20px;
  font-size:18px;
  cursor:pointer;
  border:none;
  border-radius:10px;
}
</style>
</head>

<body>

<h1>🎰 Slot Machine</h1>

<div class="machine">
  <div class="reel"><div id="r1"></div></div>
  <div class="reel"><div id="r2"></div></div>
  <div class="reel"><div id="r3"></div></div>
</div>

<button onclick="spin()">SPIN</button>

<script>
const symbols = ["🍒","🍋","⭐","💎","7️⃣"];

function fillReel(el){
  el.innerHTML="";

  for(let i=0;i<20;i++){
    const s=document.createElement("div");
    s.className="symbol";

    const sym = symbols[Math.floor(Math.random()*symbols.length)];

    s.textContent = sym;

    el.appendChild(s);
  }
}

function spin(){

  const reels = [
    document.getElementById("r1"),
    document.getElementById("r2"),
    document.getElementById("r3")
  ];

  let results = [];

  reels.forEach((reel,i)=>{

    fillReel(reel);

    const index = Math.floor(Math.random()*10)+5;

    const offset = index * 80;

    results[i] = reel.children[index].textContent;

    reel.style.transition="none";
    reel.style.transform="translateY(0px)";

    setTimeout(()=>{

      reel.style.transition =
      "transform 1s cubic-bezier(.2,.8,.3,1)";

      reel.style.transform =
      `translateY(-${offset}px)`;

    },50 + i*200);

  });

  setTimeout(()=>{

    const a = results[0];
    const b = results[1];
    const c = results[2];

    let sound = "";

    if(a===b && b===c){

      sound = "sounds/three.mp3";

    } else if(a===b || b===c || a===c){

      sound = "sounds/two.mp3";

    }

    if(sound){

      const audio = new Audio(sound);

      audio.play();

    }

  },1500);

}
</script>
<script src="menu.js"></script>

</body>
</html>

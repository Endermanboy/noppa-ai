<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<title>3D Slot</title>
<style>
body{
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  margin:0;
  background:#111;
  color:white;
  flex-direction:column;
  perspective:1000px;
}

.machine{
  display:flex;
  gap:20px;
}

.reel{
  width:80px;
  height:80px;
  overflow:hidden;
  border:2px solid white;
  border-radius:10px;
  background:#000;
}

.reel div{
  display:flex;
  flex-direction:column;
  align-items:center;
  transition:transform 1s cubic-bezier(.2,.8,.3,1);
}

.symbol{
  height:80px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:40px;
}

button{
  margin-top:20px;
  padding:10px 20px;
  font-size:18px;
  cursor:pointer;
}
</style>
</head>
<body>

<div class="machine">
  <div class="reel"><div id="r1"></div></div>
  <div class="reel"><div id="r2"></div></div>
  <div class="reel"><div id="r3"></div></div>
</div>

<button onclick="spin()">SPIN</button>

<script>
const symbols = ["🍒","🍋","⭐","💎","7️⃣"];

function fillReel(el){
  el.innerHTML="";
  for(let i=0;i<20;i++){
    const s=document.createElement("div");
    s.className="symbol";
    s.textContent = symbols[Math.floor(Math.random()*symbols.length)];
    el.appendChild(s);
  }
}

function spin(){
  const reels=[r1,r2,r3];

  reels.forEach((reel,i)=>{
    fillReel(reel);

    const offset = Math.floor(Math.random()*15)*80;

    reel.style.transition="none";
    reel.style.transform="translateY(0px)";

    setTimeout(()=>{
      reel.style.transition="transform 1s cubic-bezier(.2,.8,.3,1)";
      reel.style.transform=`translateY(-${offset}px)`;
    },50 + i*200);
  });

  // ⏱️ tarkista tulos kun spin loppuu
  setTimeout(()=>{
    const a = r1.children[10].textContent;
    const b = r2.children[10].textContent;
    const c = r3.children[10].textContent;

    let match = 0;
    if(a===b) match++;
    if(b===c) match++;
    if(a===c) match++;

    let sound = "";

    if(match===1) sound = "sounds/one.mp3";
    if(match===2) sound = "sounds/two.mp3";
    if(match===3) sound = "sounds/three.mp3";

    if(sound){
      const audio = new Audio(sound);
      audio.play();
    }

  },1500);
}
</script>

</body>
</html>

<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WAV → SFO</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#11232c;color:white;font:16px Arial,sans-serif}
main{width:min(460px,92vw);padding:25px;border-radius:18px;background:#23404c}
input,button{width:100%;margin:12px 0}
button{padding:14px;background:#8ae6b3;color:#102a22;border:0;border-radius:10px;font-weight:bold}
button:disabled{opacity:.5}
#status{white-space:pre-wrap;overflow-wrap:anywhere}
small{color:#c7d9df}
</style>
<!-- Lataa varmasti sama FFmpeg-versio, jota tämä sivu käyttää. -->
<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
</head>
<body>
<main>
<h1>🎣 WAV → SFO</h1>
<p>Valitse WAV-ääni ja kokeile muupoisntaa se Pro Pilkki 2:n SFO-muotoon.</p>
<input type="file" id="file" accept=".wav,audio/wav,audio/x-wav">
<button id="go">Muunna SFO:ksi</button>
<p id="status" role="status">Valitse tiedosto.</p>
<small>FFmpeg-ydin ja WASM ladataan internetistä. Ääni käsitellään selaimessa. Tämä kokeellinen OGG→SFO-muunnos ei ole vahvistettu Pro Pilkki 2:n viralliseksi SFO-tiedostorakenteeksi.</small>
</main>
<script>
const el = id => document.getElementById(id);
let ffmpeg = null;
let ffmpegLoadPromise = null;
async function loadFFmpeg() {
  if (ffmpeg && ffmpeg.loaded) return ffmpeg;
  if (ffmpegLoadPromise) return ffmpegLoadPromise;

  ffmpegLoadPromise = (async () => {
    if (!window.FFmpegWASM || !window.FFmpegWASM.FFmpeg) {
      throw new Error("FFmpeg-kirjasto ei latautunut. Tarkista verkkoyhteys.");
    }

    el("status").textContent = "Ladataan FFmpeg-työntekijää ja ydintä...";

    // Worker-tiedosto on samassa GitHub-kansiossa kuin index.html.
    // Käytä absoluuttisia osoitteita: Worker ratkaisee URL-osoitteet
    // omasta sijainnistaan, ei aina sivun sijainnista.
    const workerURL = new URL("./814.ffmpeg.js", window.location.href).href;
    const coreBase = "https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.10/dist/umd";

    ffmpeg = new window.FFmpegWASM.FFmpeg();
    ffmpeg.on("log", ({message}) => {
      if (message) console.log("[FFmpeg]", message);
    });
    ffmpeg.on("progress", ({progress}) => {
      if (Number.isFinite(progress)) {
        el("status").textContent = "Muunnetaan ääntä... " + Math.round(progress * 100) + "%";
      }
    });

    // Älä muuta ffmpeg-core.js:ää Blob-osoitteeksi. UMD-ydin pitää
    // ladata normaalista URL-osoitteesta, jotta sen WASM-polku löytyy.
    await ffmpeg.load({
      classWorkerURL: workerURL,
      coreURL: coreBase + "/ffmpeg-core.js",
      wasmURL: coreBase + "/ffmpeg-core.wasm"
    });
    return ffmpeg;
  })();

  try {
    return await ffmpegLoadPromise;
  } catch (error) {
    ffmpegLoadPromise = null;
    ffmpeg = null;
    throw error;
  }
}

function crc32ogg(bytes) {
  let c = 0;
  for (let i = 0; i < bytes.length; i++) {
    c = (c ^ (bytes[i] << 24)) >>> 0;
    for (let j = 0; j < 8; j++) {
      c = ((c & 0x80000000) ? ((c << 1) ^ 0x04c11db7) : (c << 1)) >>> 0;
    }
  }
  return c >>> 0;
}

function oggToSfo(ogg) {
  const out = new Uint8Array(ogg);
  let pos = 0;
  while (pos < out.length) {
    if (pos + 27 > out.length ||
        String.fromCharCode(...out.subarray(pos, pos + 4)) !== "OggS") {
      throw new Error("OGG-sivun otsake on virheellinen kohdassa " + pos);
    }
    const segments = out[pos + 26];
    const headEnd = pos + 27 + segments;
    if (headEnd > out.length) throw new Error("OGG-segmenttitaulukko katkennut");
    let payload = 0;
    for (let j = pos + 27; j < headEnd; j++) payload += out[j];
    const end = headEnd + payload;
    if (end > out.length) throw new Error("OGG-data katkennut");

    // Alkuperäisen kokeellisen muunnoksen otsakemuutokset.
    out.set([79, 83, 78, 68], pos);
    for (let i = headEnd; i + 6 <= end; i++) {
      if (out[i] === 118 && out[i+1] === 111 && out[i+2] === 114 &&
          out[i+3] === 98 && out[i+4] === 105 && out[i+5] === 115) {
        out.set([112, 109, 117, 115, 105, 99], i);
        i += 5;
      }
    }
    out.fill(0, pos + 22, pos + 26);
    const checksum = crc32ogg(out.subarray(pos, end));
    new DataView(out.buffer, out.byteOffset + pos + 22, 4).setUint32(0, checksum, true);
    pos = end;
  }
  return out;
}

el("go").addEventListener("click", async () => {
  const file = el("file").files[0];
  if (!file) {
    el("status").textContent = "Valitse ensin WAV-tiedosto.";
    return;
  }

  const button = el("go");
  button.disabled = true;
  let inputWritten = false;
  let outputWritten = false;

  try {
    const engine = await loadFFmpeg();
    el("status").textContent = "Luetaan WAV-tiedostoa...";
    await engine.writeFile("input.wav", new Uint8Array(await file.arrayBuffer()));
    inputWritten = true;

    el("status").textContent = "Muunnetaan WAV OGG-muotoon...";
    const exitCode = await engine.exec([
      "-i", "input.wav", "-vn", "-c:a", "libvorbis",
      "-ar", "44100", "-ac", "2", "-f", "ogg", "output.ogg"
    ]);
    if (exitCode !== 0) throw new Error("Äänen muunnos epäonnistui (FFmpeg " + exitCode + ").");

    const ogg = await engine.readFile("output.ogg");
    outputWritten = true;
    el("status").textContent = "Rakennetaan kokeellista SFO-tiedostoa...";
    const sfo = oggToSfo(ogg);
    const downloadURL = URL.createObjectURL(
      new Blob([sfo], {type: "application/octet-stream"})
    );
    const link = document.createElement("a");
    link.href = downloadURL;
    link.download = file.name.replace(/\.wav$/i, "") + ".sfo";
    document.body.appendChild(link);
    link.click();
    link.remove();
    URL.revokeObjectURL(downloadURL);

    el("status").textContent =
      "Valmis! Tiedosto ladattu (" + sfo.length + " tavua). Huomaa, ettei peliyhteensopivuutta ole varmistettu.";
  } catch (error) {
    console.error(error);
    el("status").textContent = "Virhe: " + (error && error.message ? error.message : String(error));
  } finally {
    if (ffmpeg && ffmpeg.loaded) {
      try { if (inputWritten) await ffmpeg.deleteFile("input.wav"); } catch (_) {}
      try { if (outputWritten) await ffmpeg.deleteFile("output.ogg"); } catch (_) {}
    }
    button.disabled = false;
  }
});

</script>
</body>
</html>

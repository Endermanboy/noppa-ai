
<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WAV → FSO-muunnin</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: #111;
  color: white;
  font-family: Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 440px;
  background: #222;
  border-radius: 16px;
  padding: 25px;
  text-align: center;
}

h1 { font-size: 25px; }

input, select, button {
  width: 100%;
  padding: 14px;
  margin-top: 15px;
  border: 0;
  border-radius: 8px;
  font-size: 16px;
}

button {
  background: #1685ff;
  color: white;
  font-weight: bold;
}

button:disabled {
  opacity: .5;
}

#status {
  margin-top: 20px;
  overflow-wrap: anywhere;
}

progress {
  width: 100%;
  margin-top: 15px;
}

small {
  color: #aaa;
}
</style>
</head>

<body>

<div class="container">

<h1>🎵 WAV → FSO-muunnin</h1>

<p>Valitse WAV-tiedosto.</p>

<input type="file" id="file" accept=".wav,audio/wav">

<select id="format">
  <option value="FSO">FSO</option>
  <option value="sfo">SFO</option>
</select>

<button id="start">Käynnistä FFmpeg</button>

<button id="convert" disabled>
  Muunna tiedosto
</button>

<progress id="progress" value="0" max="100"></progress>

<div id="status">Valmis käynnistettäväksi.</div>

<br>
<small>FFmpeg 0.12.10</small>

</div>

<script type="module">

import { FFmpeg } from
"https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/esm/index.js";

import {
  fetchFile,
  toBlobURL
} from
"https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.2/dist/esm/index.js";

const ffmpeg = new FFmpeg();

const startButton = document.getElementById("start");
const convertButton = document.getElementById("convert");
const fileInput = document.getElementById("file");
const status = document.getElementById("status");
const progress = document.getElementById("progress");

let loaded = false;
let busy = false;

ffmpeg.on("log", ({ message }) => {
  console.log(message);
});

ffmpeg.on("progress", ({ progress: value }) => {
  progress.value = Math.round(value * 100);
});

startButton.onclick = async () => {

  if (loaded || busy) return;

  busy = true;
  startButton.disabled = true;
  status.textContent = "Ladataan FFmpeg...";

  let workerBlobURL;

  try {

    const ffmpegURL =
      "https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/esm";

    const coreURL =
      "https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.10/dist/umd";

    // Lataa FFmpeg Worker Blob-osoitteeksi.
    const workerResponse = await fetch(
      ffmpegURL + "/worker.js"
    );

    if (!workerResponse.ok) {
      throw new Error("Worker.js lataus epäonnistui");
    }

    const workerCode = await workerResponse.text();

    workerBlobURL = URL.createObjectURL(
      new Blob([workerCode], {
        type: "text/javascript"
      })
    );

    status.textContent = "Käynnistetään FFmpeg...";

    await ffmpeg.load({
      classWorkerURL: workerBlobURL,

      coreURL: await toBlobURL(
        coreURL + "/ffmpeg-core.js",
        "text/javascript"
      ),

      wasmURL: await toBlobURL(
        coreURL + "/ffmpeg-core.wasm",
        "application/wasm"
      )
    });

    loaded = true;
    convertButton.disabled = false;

    status.textContent = "FFmpeg käynnissä!";

  } catch (error) {

    status.textContent =
      "Virhe: " + error.message;

    startButton.disabled = false;

  } finally {
    busy = false;
  }
};

convertButton.onclick = async () => {

  if (busy) return;

  const file = fileInput.files[0];

  if (!file) {
    status.textContent = "Valitse ensin WAV-tiedosto!";
    return;
  }

  if (!loaded) {
    status.textContent = "Käynnistä ensin FFmpeg!";
    return;
  }

  busy = true;
  convertButton.disabled = true;
  progress.value = 0;

  try {

    status.textContent = "Ladataan WAV-tiedostoa...";

    await ffmpeg.writeFile(
      "input.wav",
      await fetchFile(file)
    );

    status.textContent = "Muunnetaan...";

    await ffmpeg.exec([
      "-i", "input.wav",
      "-c:a", "pcm_s16le",
      "-f", "wav",
      "output.wav"
    ]);

    const data = await ffmpeg.readFile("output.wav");

    const blob = new Blob([data], {
      type: "audio/wav"
    });

    const url = URL.createObjectURL(blob);

    const extension =
      document.getElementById("format").value;

    const a = document.createElement("a");

    a.href = url;
    a.download = "converted." + extension;

    document.body.appendChild(a);
    a.click();
    a.remove();

    setTimeout(() => URL.revokeObjectURL(url), 1000);

    status.textContent = "Valmis! Tiedosto ladattu.";

  } catch (error) {

    status.textContent =
      "Virhe: " + error.message;

  } finally {

    busy = false;
    convertButton.disabled = false;

  }
};

</script>

</body>
</html>

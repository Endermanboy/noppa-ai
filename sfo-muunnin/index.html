<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WAV → Pro Pilkki 2 SFO</title>
<style>
body{font-family:Arial,sans-serif;background:#10212b;color:#fff;min-height:100vh;display:grid;place-items:center;margin:0}
main{background:#203947;padding:26px;border-radius:18px;width:min(420px,88vw)}
button,input{margin-top:16px;width:100%;box-sizing:border-box}button{padding:14px;border:0;border-radius:9px;background:#7ce0aa;color:#10212b;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5;cursor:wait}#status{white-space:pre-wrap;overflow-wrap:anywhere;color:#d4e8ef;font-size:14px}
</style>
</head>
<body><main>
<h1>🎣 WAV → SFO</h1>
<p>Muunna WAV-ääni Pro Pilkki 2 -tyyliseksi .sfo-tiedostoksi suoraan selaimessa.</p>
<input id="file" type="file" accept=".wav,audio/wav,audio/x-wav">
<button id="convert">Muunna SFO:ksi</button>
<p id="status" role="status">Valitse WAV-tiedosto.</p>
<small>Ensimmäisellä kerralla FFmpeg ladataan internetistä. Äänitiedostoa ei lähetetä palvelimelle. Peliyhteensopivuutta ei ole taattu.</small>
<script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
<script>
const $=id=>document.getElementById(id);
const POLY=0x04c11db7;
function crc(bytes){
 let c=0;
 for(const b of bytes){
  c=(c^(b<<24))>>>0;
  for(let j=0;j<8;j++) c=(((c&0x80000000)?((c<<1)^POLY):(c<<1)))>>>0;
 }
 return c>>>0;
}
function toSFO(ogg){
 let p=0;const out=new Uint8Array(ogg.length);
 while(p<ogg.length){
  if(p+27>ogg.length||String.fromCharCode(...ogg.subarray(p,p+4))!=="OggS")throw Error("Virheellinen OGG-sivu kohdassa "+p);
  const count=ogg[p+26], headerEnd=p+27+count;
  if(headerEnd>ogg.length)throw Error("OGG-otsake katkennut");
  let size=0;for(let i=p+27;i<headerEnd;i++)size+=ogg[i];
  const end=headerEnd+size;
  if(end>ogg.length)throw Error("OGG-sivu katkennut");
  const page=out.subarray(p,end);page.set(ogg.subarray(p,end));
  page.set([79,83,78,68],0); // OSND
  // Change Vorbis identification strings, as in the original SFO conversion.
  for(let i=0;i<=page.length-6;i++){
   if(page[i]===118&&page[i+1]===111&&page[i+2]===114&&page[i+3]===98&&page[i+4]===105&&page[i+5]===115){
    page.set([112,109,117,115,105,99],i);i+=5; // pmusic
   }
  }
  page.fill(0,22,26);
  const c=crc(page);new DataView(page.buffer,page.byteOffset,page.byteLength).setUint32(22,c,true);
  p=end;
 }
 return out;
}
let ffmpeg;
$("convert").onclick=async()=>{
 const f=$("file").files[0];
 if(!f){$("status").textContent="Valitse ensin WAV-tiedosto.";return;}
 $("convert").disabled=true;
 try{
  $("status").textContent="Ladataan muunninta (ensimmäinen kerta voi kestää)...";
  if(!ffmpeg){
   if(!window.FFmpegWASM)throw Error("FFmpeg-kirjastoa ei saatu ladattua. Tarkista internetyhteys.");
   ffmpeg=new FFmpegWASM.FFmpeg();
   const base="https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd";
   const toBlobURL=async(url,type)=>URL.createObjectURL(new Blob([await (async()=>{const r=await fetch(url);if(!r.ok)throw Error("Lataus epäonnistui: "+url);return r.arrayBuffer();})()],{type}));
   await ffmpeg.load({coreURL:await toBlobURL(base+"/ffmpeg-core.js","text/javascript"),wasmURL:await toBlobURL(base+"/ffmpeg-core.wasm","application/wasm")});
  }
  $("status").textContent="Muunnetaan WAV → OGG...";
  const wav=new Uint8Array(await f.arrayBuffer());
  await ffmpeg.writeFile("input.wav",wav);
  const result=await ffmpeg.exec(["-i","input.wav","-vn","-c:a","libvorbis","-ar","44100","-ac","2","-f","ogg","output.ogg"]);
  if(result!==0)throw Error("FFmpeg ei pystynyt muuntamaan ääntä (virhekoodi "+result+").");
  const ogg=await ffmpeg.readFile("output.ogg");
  $("status").textContent="Rakennetaan SFO...";
  const sfo=toSFO(ogg);
  const url=URL.createObjectURL(new Blob([sfo],{type:"application/octet-stream"}));
  const a=document.createElement("a");a.href=url;a.download=f.name.replace(/\.wav$/i,"")+".sfo";document.body.append(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),60000);
  $("status").textContent="Valmis! SFO ladattu ("+sfo.length+" tavua).";
  await ffmpeg.deleteFile("input.wav");await ffmpeg.deleteFile("output.ogg");
 }catch(e){$("status").textContent="Virhe: "+e.message;console.error(e);}
 finally{$("convert").disabled=false;}
};
</script></main></body></html>

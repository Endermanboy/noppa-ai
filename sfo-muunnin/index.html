
<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WAV → FSO-muunnin</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #111;
  color: white;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 450px;
  background: #222;
  padding: 25px;
  border-radius: 16px;
  text-align: center;
}

h1 {
  font-size: 25px;
}

input, select, button {
  width: 100%;
  padding: 13px;
  margin-top: 15px;
  border-radius: 8px;
  border: none;
  font-size: 16px;
}

button {
  background: #1685ff;
  color: white;
  font-weight: bold;
}

button:disabled {
  opacity: 0.5;
}

#status {
  margin-top: 20px;
  overflow-wrap: anywhere;
  color: #ddd;
}

progress {
  width: 100%;
  margin-top: 15px;
}

.note {
  color: #aaa;
  font-size: 13px;
}
</style>
</head>

<body>

<div class="container">
  <h1>🎵 WAV → FSO-muunnin</h1>

  <p>Valitse WAhV-äänitiedosto.</p>

  <input type="file" id="file" accept=".wav,audio/wav">

  <label for="format">Tulostiedoston pääte:</label>
  <select id="format">
    <option value="FSO">.FSO</option>
    <option value="sfo">.sfo</option>
  </select>

  <button id="load">Käynnistä FFmpeg</button>
  <button id="convert" disabled>Muunna tiedosto</button>

  <progress id="progress" value="0" max="100"></progress>

  <div id="status">FFmpeg ei ole vielä käynnissä.</div>

  <p class="note">
    FFmpeg ladataan CDN-palvelimelta.
  </p>
</div>

<script type="module">
import { FFmpeg } from
  "https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/esm/index.js";

import {
  fetchFile,
  toBlobURL
} from
  "https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.2/dist/esm/index.js";

const ffmpeg = new FFmpeg();

const fileInput = document.getElementById("file");
const loadButton = document.getElementById("load");
const convertButton = document.getElementById("convert");
const status = document.getElementById("status");
const progress = document.getElementById("progress");

let loaded = false;

ffmpeg.on("log", ({ message }) => {
  status.textContent = message;
});

ffmpeg.on("progress", ({ progress: value }) => {
  progress.value = Math.round(value * 100);
});

loadButton.addEventListener("click", async () => {
  if (loaded) return;

  try {
    loadButton.disabled = true;
    status.textContent = "Ladataan FFmpeg-tiedostoja...";

    const baseURL =
      "https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.10/dist/umd";

    await ffmpeg.load({
      coreURL: await toBlobURL(
        `${baseURL}/ffmpeg-core.js`,
        "text/javascript"
      ),
      wasmURL: await toBlobURL(
        `${baseURL}/ffmpeg-core.wasm`,
        "application/wasm"
      )
    });

    loaded = true;
    convertButton.disabled = false;
    status.textContent = "FFmpeg käynnistetty!";

  } catch (error) {
    status.textContent = "Virhe: " + error.message;
    loadButton.disabled = false;
  }
});

convertButton.addEventListener("click", async () => {
  const file = fileInput.files[0];

  if (!file) {
    status.textContent = "Valitse ensin WAV-tiedosto!";
    return;
  }

  if (!loaded) {
    status.textContent = "Käynnistä ensin FFmpeg!";
    return;
  }

  try {
    convertButton.disabled = true;
    progress.value = 0;
    status.textContent = "Muunnetaan...";

    await ffmpeg.writeFile(
      "input.wav",
      await fetchFile(file)
    );

    // HUOM: Tämä tekee WAV-sisällöstä WAV-muotoisen
    // tiedoston uudella päätteellä.
    const format = document.getElementById("format").value;

    await ffmpeg.exec([
      "-i", "input.wav",
      "-c:a", "pcm_s16le",
      "-f", "wav",
      "output.wav"
    ]);

    const data = await ffmpeg.readFile("output.wav");

    const blob = new Blob([data], {
      type: "audio/wav"
    });

    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");

    a.href = url;
    a.download = "converted." + format;
    a.click();

    URL.revokeObjectURL(url);

    status.textContent =
      "Valmis! Tiedosto ladattu.";

  } catch (error) {
    status.textContent = "Virhe: " + error.message;
  } finally {
    convertButton.disabled = false;
  }
});
</script>

</body>
</html>
